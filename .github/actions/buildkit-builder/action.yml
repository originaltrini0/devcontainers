name: Configure remote BuildKit
description: >-
  Point buildx at the shared buildkitd-github worker in the ci-builders
  namespace. ARC runner pods have no Docker daemon; client certs are mounted
  at /etc/buildkit by the scale-set pod template. arm64 layers run under the
  node's QEMU emulation inside buildkitd.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Driver-opt keys are cacert/cert/key (per the working
        # gh-runner-e2e-tests recipe); the long buildx-driver-remote-* names
        # are rejected as invalid by the remote driver.
        docker buildx create --name buildkit-github --driver remote \
          --driver-opt "cacert=/etc/buildkit/ca.pem" \
          --driver-opt "cert=/etc/buildkit/cert.pem" \
          --driver-opt "key=/etc/buildkit/key.pem" \
          "${BUILDKIT_HOST:-tcp://buildkitd-github.ci-builders.svc.cluster.local:1234}"
        docker buildx inspect --bootstrap buildkit-github
        echo 'BUILDX_BUILDER=buildkit-github' >> "$GITHUB_ENV"
